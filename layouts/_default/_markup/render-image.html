{{ $alt := .Text }}
{{ $src := .Destination }}
{{ $url := $src | relURL }}
{{ $resource := resources.Get $src }}

{{ if reflect.IsImageResourceProcessable $resource }}
  <img
    src="{{ $resource.RelPermalink }}"
    width="{{ $resource.Width }}"
    height="{{ $resource.Height }}"
    alt="{{ $alt }}"
  />
{{ else }}
  <img src="{{ $url | safeURL }}" alt="{{ $alt }}" />
{{ end }}
